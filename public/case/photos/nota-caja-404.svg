<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Nota manuscrita encontrada en la caja 404</title>
  <desc id="d">Papel doblado con una nota escrita a mano que dice 0847, no firmar, y caja 404.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1714"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#efe7d4"/>
      <stop offset="1" stop-color="#d3c7ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="fiber" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 3h8M2 7h6" stroke="#8d7f63" stroke-width="0.4" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#desk)"/>
  <g opacity="0.2" stroke="#5a4c39" fill="none">
    <path d="M0 80h800M0 440h800"/>
    <path d="M40 0v520M760 0v520"/>
  </g>

  <g filter="url(#shadow)" transform="rotate(-3 400 260)">
    <path d="M158 110l476-16 18 320-476 18z" fill="url(#paper)"/>
    <path d="M158 110l476-16 18 320-476 18z" fill="url(#fiber)"/>
    <path d="M164 116l462-16M160 404l474-16" stroke="#b3a689" stroke-width="2" opacity="0.6"/>
    <path d="M320 110l-6 320" stroke="#c2b598" stroke-width="1.5" opacity="0.7"/>
  </g>

  <g transform="rotate(-3 400 260)" fill="#2d3a4a" font-family="Segoe UI, Arial, sans-serif">
    <text x="210" y="186" font-size="38" font-weight="700" letter-spacing="4">0847</text>
    <text x="210" y="226" font-size="16" letter-spacing="1" fill="#5b6470">LEGAJO · NO TOCAR</text>

    <path d="M212 262c42-18 86-2 128-12s88-2 122 6" stroke="#2d3a4a" stroke-width="2" fill="none" opacity="0.35"/>
    <path d="M212 284c56 8 104-10 158-4s72 10 98 2" stroke="#2d3a4a" stroke-width="2" fill="none" opacity="0.25"/>

    <text x="210" y="352" font-size="44" font-weight="700" letter-spacing="2" transform="rotate(-1 210 352)">NO FIRMAR</text>
    <text x="210" y="390" font-size="17" letter-spacing="1" fill="#5b6470">El cierre no es mío. Revisen Faro.</text>

    <text x="560" y="392" font-size="15" fill="#5b6470" text-anchor="end">— A.M.</text>
  </g>

  <g transform="rotate(8 650 150)">
    <rect x="596" y="96" width="118" height="66" rx="4" fill="#8f2f2a" opacity="0.85"/>
    <text x="655" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="20" letter-spacing="4" fill="#f0dfc8">404</text>
  </g>

  <g font-family="Consolas, monospace" fill="#b9b0a0">
    <text x="34" y="492" font-size="11" letter-spacing="2">CAJA METÁLICA 404 · subsuelo · 16/03/2026</text>
    <text x="766" y="492" text-anchor="end" font-size="11" letter-spacing="2" fill="#626b76">EV-07 / FOTO 04</text>
  </g>
