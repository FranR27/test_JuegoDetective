<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">Cámara 3 sin señal a las 02:05</title>
  <desc id="d">Fotograma de un grabador de video con ruido y el mensaje sin señal, durante el corte de la cámara 3.</desc>
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a1f"/>
      <stop offset="1" stop-color="#07090b"/>
    </linearGradient>
    <pattern id="bars" width="800" height="7" patternUnits="userSpaceOnUse">
      <rect width="800" height="7" fill="#000" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="520" fill="url(#dark)"/>
  <rect width="800" height="520" filter="url(#noise)" opacity="0.28"/>
  <rect width="800" height="520" fill="url(#bars)"/>

  <g opacity="0.16" stroke="#aab6c2" fill="none" stroke-width="1">
    <path d="M0 130h800M0 390h800M150 0v520M650 0v520"/>
  </g>

  <g transform="translate(400 252)">
    <circle cx="0" cy="0" r="74" fill="none" stroke="#d96a62" stroke-width="2" opacity="0.55"/>
    <path d="M-36 -20l72 48M36 -20l-72 48" stroke="#d96a62" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <text x="0" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="42" font-weight="700" letter-spacing="8" fill="#e9e4d8">SIN SEÑAL</text>
    <text x="0" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="3" fill="#8d97a3">CAM 03 · ESTACIONAMIENTO</text>
  </g>

  <g font-family="Consolas, monospace" fill="#c8c2b6">
    <rect x="26" y="24" width="248" height="42" rx="4" fill="#000" opacity="0.55"/>
    <text x="44" y="50" font-size="14" letter-spacing="1">NVR · CANAL 03</text>
    <text x="774" y="47" text-anchor="end" font-size="22" letter-spacing="2">02:05:12</text>
    <text x="774" y="66" text-anchor="end" font-size="10" letter-spacing="1" fill="#8d97a3">14/03/2026 · SIN GRABACIÓN</text>
  </g>

  <g font-family="Consolas, monospace" fill="#8d97a3">
    <rect x="26" y="444" width="380" height="52" rx="4" fill="#000" opacity="0.5"/>
    <text x="44" y="464" font-size="10" letter-spacing="2" fill="#d96a62">CORTE DE SEÑAL</text>
    <text x="44" y="484" font-size="12">01:50 → 02:30 · 40 min sin imagen</text>
    <text x="774" y="496" text-anchor="end" font-size="11" letter-spacing="1">EV-06 / FOTO 03</text>
  </g>
</svg>
